<style>
@font-face{font-family:SG;src:url(f.woff2) format("woff2");font-weight:700;font-style:italic}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,"Thonburi",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#stage{flex:1;position:relative;overflow:hidden}
#box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#bg,#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#bar{height:calc(54px + env(safe-area-inset-bottom));padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;
 background:linear-gradient(#06090f,#020306);border-top:2px solid var(--acc);box-shadow:0 -2px 10px var(--acc)}
.b{flex:0 0 auto;height:40px;padding:0 12px;border:1.5px solid color-mix(in srgb,var(--acc) 70%,#000);color:#cfd8e3;background:#05080e;
 font:700 15px -apple-system,sans-serif;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.b.on{background:linear-gradient(color-mix(in srgb,var(--acc) 85%,#fff),color-mix(in srgb,var(--acc) 55%,#000));color:#fff;border-color:#fff}
#st{flex:1;min-width:0;font-size:12px;color:#8fa3c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

#pn{width:min(560px,92vw);max-height:88vh;overflow:auto;background:#060a12;border:2px solid var(--acc);box-shadow:0 0 18px var(--acc);padding:16px 18px;
 clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
#pn h2{margin:0 0 10px;color:var(--acc);font-size:22px}

.row .t{flex:1}.row small{display:block;color:#8fa3c0;font-size:12px}
.st{display:flex;align-items:center;gap:8px}.st span{min-width:64px;text-align:center;font:700 italic 22px SG,sans-serif}

@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<div id="blec" style="position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px">
 <div style="font:700 26px -apple-system,sans-serif;color:var(--acc)">SMART GAUGE</div>
 <div id="blem" style="white-space:pre-line;color:#cfd8e3;font-size:16px;max-width:520px;line-height:1.5">เปิดกุญแจรถ แล้วกดเชื่อมต่อ</div>
 <button class="b" id="bleb" style="height:56px;padding:0 34px;font-size:20px">เชื่อมต่อเกจ (บลูทูธ)</button>
</div>
<div id="app">
 <div id="stage"><div id="box"><img id="bg" src="bg.jpg" alt=""><canvas id="cv"></canvas></div></div>
 <div id="bar">
  <button class="b" id="bm">☰</button>
  <button class="b on" data-p="0">เรียลไทม์</button>
  <button class="b" data-p="1">DATA</button>
  <button class="b" data-p="2">รหัสเสีย</button>
  <button class="b" data-p="3">ตาราง</button>
  <div id="st">กำลังเชื่อมต่อเกจ...</div><div id="dot"></div>
 </div>
</div>
<div id="ov"><div id="pn"></div></div>
<div id="rot"><div style="font-size:54px">⟲</div><div style="font-size:20px;font-weight:700">หมุนมือถือเป็นแนวนอน</div><div style="font-size:14px;color:#8fa3c0">SMART GAUGE ใช้งานแบบจอแนวนอน</div></div>
<script>
"use strict";
// ---------- ค่าตั้ง (เก็บในมือถือ) ----------
const THEMES=[["น้ำเงิน","#1e8fff",0],["แดง","#ff3344",150],["เขียว","#22e06a",-85],["ส้ม","#ff9a1f",177],["ม่วง","#b45cff",65],["ฟ้า","#22d3ee",-25]];
let S={th:0,max:12000,red:9500,warn:105};
try{Object.assign(S,JSON.parse(localStorage.getItem("sg")||"{}"))}catch(e){}
let TOP={spd:0,rpm:NaN,afr:NaN,at:0};
try{Object.assign(TOP,JSON.parse(localStorage.getItem("sgtop")||"{}"))}catch(e){}
function saveS(){try{localStorage.setItem("sg",JSON.stringify(S))}catch(e){}}
function saveTop(){try{localStorage.setItem("sgtop",JSON.stringify(TOP))}catch(e){}}
const ACC=()=>THEMES[S.th][1];
function applyTheme(){document.documentElement.style.setProperty("--acc",ACC());
 document.getElementById("bg").style.filter=S.th?`hue-rotate(${THEMES[S.th][2]}deg) saturate(1.25)`:"none"}
applyTheme();

// ---------- สี ----------
const RED="#ef4444",REDL="#ff2d3a",LIME="#a3e635",AMBER="#fbbf24",MUTE="#8fa3c0",GREY="#cfd8e3",DIM="#1a222e";
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=p(a),B=p(b);
 return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")}
const LIGHT=()=>mix(ACC(),"#ffffff",.55);
function segc(i,n){return mix(mix(ACC(),"#000000",.15),LIGHT(),n<=1?0:.85*i/(n-1))}

// ---------- ค่าสด ----------
let D=null,lastOk=0;
function parse(h){const p=[];for(let i=0;i<40;i+=2)p.push(parseInt(h.substr(i,2),16));
 const u16=i=>p[i]|(p[i+1]<<8),f8=(i,k,o)=>p[i]==255?NaN:(p[i]-o)/k,f16=(i,k)=>u16(i)==0xFFFF?NaN:u16(i)/k,f=p[0];
 return{online:!!(f&1),gps:!!(f&2),pro:!!(f&4),demo:!!(f&8),rpm:f16(1,1),spd:f16(3,10),tps:f8(5,2,0),ect:f8(6,1,40),iat:f8(7,1,40),
  map:f8(8,1,0),afr:f8(9,10,0),ign:p[10]==0x80?NaN:((p[10]<<24)>>24)/2,inj:f16(11,100),bat:f8(13,10,0),gtop:f16(14,10),
  sats:p[16],mil:p[17]==255?-1:p[17],o2:f8(18,100,0),isc:f8(19,1,0)}}
function fmt(v,d){return v==null||isNaN(v)?"--":v.toFixed(d)}
// ดึงข้อมูลแบบมีเวลาหมด: แพ็กเก็ตหายกลางทาง ไม่ค้างรอ (เดิมรอได้เป็นนาที = หน้าเว็บค้าง)
async function getT(u,ms){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
 try{const r=await fetch(u,{cache:"no-store",signal:ac.signal});return await r.text()}finally{clearTimeout(tm)}}
function gotLive(t){if(t&&t.length>=40){D=parse(t);lastOk=Date.now();trackTop()}}
// ค่าสดแบบสตรีม: เกจส่งมาเองทุก 0.1 วิ ผ่านสายเดียวที่เปิดค้างไว้ (ไม่ต้องขอทีละครั้ง = ไวกว่ามาก)
let es=null,esAt=0;
function openStream(){if(!window.EventSource)return;try{es&&es.close()}catch(e){}
 es=new EventSource("/ev");es.onmessage=e=>{esAt=Date.now();gotLive(e.data)};
 es.onerror=()=>{if(es.readyState===2)setTimeout(openStream,1500)}}
// สำรอง: สตรีมเงียบเกิน 0.8 วิ -> ขอค่าแบบเดิมไปก่อน
async function pollLive(){
 if(Date.now()-esAt<800){setTimeout(pollLive,200);return}
 try{gotLive(await getT("/live",1200))}catch(e){}
 if(Date.now()-esAt>4000&&es&&es.readyState!==1)openStream();
 setTimeout(pollLive,80)}
let prevSpd=NaN,prevAt=0;
function trackTop(){const s=D.spd,now=Date.now();if(isNaN(s)||D.demo){prevSpd=NaN;return}
 // กันค่ากระโดด (GPS เด้ง): ขึ้นเร็วเกิน 40 km/h ใน 1 วิ ไม่นับ
 if(!isNaN(prevSpd)&&now-prevAt<1500&&s-prevSpd>40*(now-prevAt)/1000+3){prevAt=now;return}
 prevSpd=s;prevAt=now;
 if(s>TOP.spd+0.05){TOP={spd:s,rpm:D.rpm,afr:D.afr,at:now};if(!trackTop.t||now-trackTop.t>2000){trackTop.t=now;saveTop()}}}

// ---------- คำสั่ง / ข้อความจากเกจ (รหัสเสีย) ----------
let DTC={loaded:false,busy:false,codes:[],msg:"กด \"อ่านรหัส\" เพื่อดูรหัสเสีย (เปิดกุญแจรถ)",mc:MUTE};
// ===== ช่องทางเชื่อมต่อ: เปิดจากเว็บ https (GitHub Pages ในแอพ Bluefy) = บลูทูธ / เปิดจาก 192.168.4.1 = WiFi ของเกจ =====
const VIA_BLE=location.protocol==="https:";
const SVC="53470001-8a3b-4c2d-9f10-5a6d61727447",U_LIVE="53470002-8a3b-4c2d-9f10-5a6d61727447",U_CMD="53470003-8a3b-4c2d-9f10-5a6d61727447",U_DATA="53470004-8a3b-4c2d-9f10-5a6d61727447";
let bDev=null,bCmd=null,bOn=false,bBuf=[],bBusy=false;
const hex2=b=>Array.from(b,x=>(x<16?"0":"")+x.toString(16).toUpperCase()).join("");
function bleUi(msg){const o=document.getElementById("blec");o.style.display=bOn?"none":"flex";if(msg)document.getElementById("blem").textContent=msg}
async function bleSetup(){
 const g=await bDev.gatt.connect(),sv=await g.getPrimaryService(SVC);
 const lv=await sv.getCharacteristic(U_LIVE),dt=await sv.getCharacteristic(U_DATA);bCmd=await sv.getCharacteristic(U_CMD);
 lv.addEventListener("characteristicvaluechanged",e=>gotLive(hex2(new Uint8Array(e.target.value.buffer))));
 dt.addEventListener("characteristicvaluechanged",e=>{const v=new Uint8Array(e.target.value.buffer);if(!v.length)return;
  const n=Math.min(v[0]&127,v.length-1);for(let i=1;i<=n;i++)bBuf.push(v[i]);
  if(v[0]&128){const m=new TextDecoder().decode(new Uint8Array(bBuf));bBuf=[];onMsg(m)}});
 await lv.startNotifications();await dt.startNotifications();
 bOn=true;bleUi();if(page==3)mapReq()}
async function bleConnect(){
 if(!navigator.bluetooth){bleUi("เบราว์เซอร์นี้ใช้บลูทูธไม่ได้\nให้เปิดลิงก์นี้ในแอพ Bluefy (โหลดฟรีใน App Store)\nหรือต่อ WiFi ของเกจ แล้วเปิด 192.168.4.1");return}
 if(bBusy)return;bBusy=true;bleUi("กำลังเชื่อมต่อ...");
 try{if(!bDev){bDev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
   bDev.addEventListener("gattserverdisconnected",bleLost)}
  await bleSetup()}
 catch(e){bOn=false;bleUi("เชื่อมต่อไม่สำเร็จ ลองกดอีกครั้ง\n(เปิดกุญแจรถ และเปิดบลูทูธที่เกจ)")}
 bBusy=false}
// หลุด: ลองต่อใหม่เองสูงสุด 10 ครั้ง (ไม่ต้องเลือกเครื่องใหม่)
async function bleLost(){bOn=false;bBuf=[];bleUi("สัญญาณหลุด กำลังต่อใหม่...");
 for(let i=0;i<10&&!bOn;i++){await new Promise(r=>setTimeout(r,1500));try{await bleSetup()}catch(e){}}
 if(!bOn)bleUi("หลุดการเชื่อมต่อ กดเชื่อมต่อใหม่")}
let bQ=Promise.resolve();
function bleCmd(c){bQ=bQ.then(()=>bOn&&bCmd?(bCmd.writeValueWithoutResponse?bCmd.writeValueWithoutResponse(new TextEncoder().encode(c)):bCmd.writeValue(new TextEncoder().encode(c))):0).catch(()=>{})}
async function cmd(c){if(VIA_BLE){if(c!=="m")bleCmd(c);return}
 for(let i=0;i<3;i++){try{await getT("/cmd?c="+c,1500);return}catch(e){}}}
async function pollMsg(){
 // หน้าตาราง: เกจเงียบเกิน 4 วิ (หลุดแล้วต่อใหม่ / คำสั่งหาย) -> ขอตารางใหม่เอง
 if(page==3&&Date.now()-lastOk<1500&&Date.now()-MP.last>4000&&Date.now()-MP.req>4000){if(!MP.rows)MP.status="กำลังโหลด...";mapReq()}
 if(DTC.busy||page==3){try{const t=await getT("/msg",2500);t.split("\n").forEach(onMsg)}catch(e){}}
 setTimeout(pollMsg,300)}
function onMsg(m){if(!m)return;const f=m.split("|");if("MAPH M U MAPE MAPC".split(" ").includes(f[0]))MP.last=Date.now();
 switch(f[0]){
  case"MAPH":mapBegin(f);break;
  case"M":mapRow(f);break;
  case"U":mapLive(f);break;
  case"MAPE":MP.status="อัปเดตสดจากเกจ";break;
  case"MAPC":MP.status="ล้างตารางในเกจแล้ว";break;
  case"DTCN":DTC.busy=false;DTC.msg="ยังไม่ได้ต่อกล่อง ECU";DTC.mc=AMBER;break;
  case"DTCS":DTC.msg="กำลังอ่าน...";DTC.mc=LIME;break;
  case"DTC":DTC.codes=[];break;
  case"C":if(f[2]==="1")DTC.codes.push({code:f[1],th:f[3]||"",en:f[4]||""});break;
  case"CLR":DTC.msg=f[1]==="1"?"ลบรหัสแล้ว":"ลบไม่สำเร็จ";DTC.mc=f[1]==="1"?LIME:RED;break;
  case"DTCE":DTC.busy=false;DTC.loaded=true;if(DTC.msg==="กำลังอ่าน...")DTC.msg="อ่านเสร็จ";DTC.mc=LIME;break;
  case"DTCF":DTC.busy=false;DTC.msg="อ่านไม่สำเร็จ ลองใหม่";DTC.mc=RED;break;}}
function readDtc(){if(DTC.busy)return;DTC.busy=true;DTC.msg="กำลังอ่าน...";DTC.mc=LIME;cmd("D")}
function clearDtc(){if(DTC.busy)return;if(!confirm("ลบรหัสเสียทั้งหมดในกล่อง ECU?\n(เปิดกุญแจไว้ ไม่ต้องติดเครื่อง)"))return;
 DTC.busy=true;DTC.msg="กำลังลบ...";DTC.mc=AMBER;cmd("X")}

// ---------- วาด ----------
const W=1820,H=802,cv=document.getElementById("cv"),ctx=cv.getContext("2d"),box=document.getElementById("box"),bgImg=document.getElementById("bg");
let page=0,sc=1;
function layout(){const st=document.getElementById("stage"),w=st.clientWidth,h=st.clientHeight;sc=Math.min(w/W,h/H);
 box.style.width=W*sc+"px";box.style.height=H*sc+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);
 cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0)}
let lw=0,lh=0;
function relayout(){const st=document.getElementById("stage");if(st.clientWidth!==lw||st.clientHeight!==lh){lw=st.clientWidth;lh=st.clientHeight;layout()}}
// iPhone หมุนจอ / แถบ Safari ยุบ: ขนาดจริงมาช้ากว่า event -> เช็คซ้ำทุกเฟรม
["resize","orientationchange","pageshow"].forEach(e=>window.addEventListener(e,()=>{relayout();setTimeout(relayout,300);setTimeout(relayout,800)}));
const NUM=(s)=>`italic 700 ${s}px SG,-apple-system,sans-serif`,LBL=(s)=>`700 ${s}px -apple-system,"Thonburi",sans-serif`;
function T(s,x,y,size,col,al="center",font){ctx.font=(font||LBL)(size);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline="middle";ctx.fillText(s,x,y)}
function N(s,x,y,size,col,al="center"){T(s,x,y,size,col,al,NUM)}
function poly(pts,fill,glow){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
 if(glow){ctx.shadowColor=fill;ctx.shadowBlur=14}ctx.fillStyle=fill;ctx.fill();ctx.shadowBlur=0}
function line(x1,y1,x2,y2,w,col){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}
function seg(l,r,y,h,n,frac,redFrom){frac=isNaN(frac)?0:Math.max(0,Math.min(1,frac));const on=Math.round(frac*n),sw=(r-l)/n;
 for(let i=0;i<n;i++){const x=l+i*sw;poly([[x+2,y+h],[x+sw-4,y+h],[x+sw+2,y],[x+8,y]],i<on?((i+.5)/n>=redFrom?"#ff3b47":segc(i,n)):DIM)}}
function c01(v){return isNaN(v)?0:Math.max(0,Math.min(1,v))}
function afrZ(v){return v<13.2?RED:v<=15.4?LIME:AMBER}
function frame(x,y,w,h,k){k=k||1;const c1=40*k,c2=18*k,c3=40*k,c4=10*k,a=ACC();
 const P=[[x+c1,y],[x+w-c2,y],[x+w,y+c2],[x+w,y+h-c3],[x+w-c3,y+h],[x+c4,y+h],[x,y+h-c4],[x,y+c1]];
 ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
 const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,"#0b1220");g.addColorStop(1,"#020306");ctx.fillStyle=g;ctx.fill();
 ctx.lineWidth=1.8;ctx.strokeStyle="#c8d4e2";ctx.stroke();
 const gl=(pts,w)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.lineCap="round";ctx.lineJoin="round";
  ctx.shadowColor=a;ctx.shadowBlur=12;ctx.lineWidth=w;ctx.strokeStyle=a;ctx.stroke();ctx.shadowBlur=0;ctx.lineWidth=2.2;ctx.strokeStyle=mix(a,"#ffffff",.6);ctx.stroke()};
 gl([[x,y+c1+(h-c1)*.35],[x,y+h-c4],[x+c4,y+h],[x+w*.3,y+h]],6);
 gl([[x+w*.55,y],[x+w-c2,y],[x+w,y+c2]],6);
 gl([[x+w,y+h-c3-30],[x+w,y+h-c3],[x+w-c3,y+h]],5)}
function status(){if(!D||Date.now()-lastOk>2500)return[VIA_BLE?"ไม่ได้เชื่อมต่อเกจ (บลูทูธ)":"ไม่ได้เชื่อมต่อเกจ (ต่อ WiFi ของเกจ)",RED];
 let s=D.demo?"โหมดตัวอย่าง":D.online?"ECU ✓":"ยังไม่ได้ต่อกล่อง ECU";if(D.pro)s+=D.gps?"   GPS "+D.sats:"   GPS หาดาว";
 if(D.mil>0)s+="   ⚠ รหัสเสีย "+D.mil;return[s,D.online||D.demo?LIME:AMBER]}

// ----- หน้าเรียลไทม์ (ทับรูป bg.jpg) -----
let shown=0;
function drawDash(d){const acc=ACC(),GX=910,GY=320,A0=128,A1=392,R0=252,max=S.max,red=S.red;
 const tgt=isNaN(d.rpm)?0:d.rpm;shown+=(tgt-shown)*.3;const hot=shown>=red;
 for(let k=0;k<=max/500;k++){const v=k*500,an=(A0+(A1-A0)*v/max)*Math.PI/180,mj=k%2==0,cs=Math.cos(an),sn=Math.sin(an),r1=R0-(mj?34:20),col=v>=red?REDL:"#f2f6fb";
  line(GX+cs*R0,GY+sn*R0,GX+cs*r1,GY+sn*r1,mj?7:3,col);if(mj)N(String(v/1000),GX+cs*(R0-62),GY+sn*(R0-62),36,col)}
 const ar=(A0+(A1-A0)*Math.min(1,red/max))*Math.PI/180;
